<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IIIA 贴纸复刻（1.1 双维度）</title>
<style>
  :root{
    --blue:#41b0f6;
    --c0:#fbb47e; --c1:#d39390; --c2:#b660a8; --c3:#b84ccc; --c4:#8e61e5; --c5:#4d6bfe;
    --dur:.32s;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:36px 24px 60px;
    background:#eef0f4;
    font-family:"Alibaba PuHuiTi","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:28px;
    color:#333;
  }
  h1{ font-size:16px; font-weight:600; margin:0; color:#555; }

  /* ===== 贴纸本体（500×400，坐标对齐原 SVG） ===== */
  .sticker{
    position:relative; width:500px; height:400px;
    background:var(--blue);
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
  }
  .header{
    position:absolute; top:0; left:0; right:0; height:70px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:50px; font-weight:700;
    letter-spacing:-2px;
    padding-bottom:8px;
  }
  .card{
    position:absolute; left:10px; right:10px; top:70px; bottom:10px;
    background:#fff; border-radius:26px;
  }

  /* 柱状区：上下两组关于「人工制作—自动生成」轴镜像
     上下留白取 25，与柱组的左右留白（左 25 / 右 24.4）对齐
     以下数值为 G1 形态的首帧占位，render() 会按 PAD_V 推导后覆盖 */
  .chart{ position:absolute; inset:0; }
  .row{ position:absolute; left:0; right:0; }
  .row.top{ bottom:55.3px; transition:bottom var(--dur) var(--ease); }
  .row.bot{ top:295px; }                            /* 下组生长基线：内容块底边，远离轴带 */

  .pill{
    position:absolute; width:62.4px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:30px; font-weight:700;
    overflow:hidden;
    transition:height var(--dur) var(--ease),
               padding-top var(--dur) var(--ease),
               padding-bottom var(--dur) var(--ease),
               bottom var(--dur) var(--ease),
               background-color var(--dur) var(--ease);
  }
  .row.top .pill{ bottom:0; border-radius:21px 21px 10px 10px; }
  /* 镜像：圆头在下。bottom 由 JS 给出「长出后整体上移」的位移量 */
  .row.bot .pill{ bottom:0; border-radius:10px 10px 21px 21px; }

  /* 星标纵向位置在两种形态下恒定，只有横向平移参与过渡
     出现/消失：缩放 0↔1 + 旋转 −120°↔0，统一走 --dur / --ease 缓出 */
  .star{
    position:absolute; top:25px; left:409.9px; width:28px; height:27px;
    transform-origin:50% 50%;
    transition:left var(--dur) var(--ease),
               transform var(--dur) var(--ease),
               opacity calc(var(--dur) * .6) var(--ease);
  }
  .star.off{
    transform:scale(0) rotate(-120deg); opacity:0;
  }

  /* 指数缺口：白底在角落被「咬」掉一个正方形，露出外框蓝底，数字用白色反白
     做法是叠一块同色蓝——外框底色是纯蓝，与真镂空像素级一致，
     且能盖掉卡片自己的圆角，缺口外沿才是直的（卡片没有 overflow:hidden，不会被裁）
     形状必须用 SVG path 画，border-radius 做不到：圆角有归属问题
       · 缺口内角（靠近卡心那个）—— 圆角归蓝底，即普通倒圆角，白鼓进来
       · 缺口与卡片两条边相接的两个角 —— 圆角必须归白底，蓝要向外鼓出 r
         若把圆角判给蓝底（给方块倒圆角），白底会被挤成一根渐细到 0 的发丝（尖尖）：
         缺口左边缘本来就与卡片左边缘重合、蓝蓝相接，白没有容身之处
         反过来鼓出后，渐细的那根刺是蓝色、融进卡片外的底色里，看不见
       · 贴着卡角的那一角保持方角：那里已是卡片之外，倒圆会露出白边 */
  .notch{
    position:absolute; top:0;
    transition:transform var(--dur) var(--ease),
               opacity calc(var(--dur) * .6) var(--ease);
  }
  .notch.left { left:0;  transform-origin:0 0; }
  .notch.right{ right:0; transform-origin:100% 0; }
  .notch.off  { transform:scale(0); opacity:0; }
  .notch svg  { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .notch path { fill:var(--blue); }
  .notch .num{
    position:absolute; top:0;                 /* 数字居中于缺口的方形部分 */
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; line-height:1;
  }
  .notch.left .num { left:0; }
  .notch.right .num{ right:0; }

  .lab{
    position:absolute; top:272px;
    font-size:19px; font-weight:700; color:#000; line-height:23px;
    transition:top var(--dur) var(--ease);
  }
  .lab.left{ left:20px; }
  .lab.right{ right:20px; }

  /* ===== 控制面板 ===== */
  .panel{
    width:500px; max-width:92vw;
    display:flex; flex-direction:column; gap:14px;
    background:#fff; border-radius:14px; padding:18px 22px;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    font-size:14px;
  }
  .row-head{ display:flex; align-items:center; gap:8px; }
  .dim{ font-weight:600; white-space:nowrap; }
  .dim .sub{ font-weight:400; color:#999; font-size:11px; margin-left:6px; }
  .tag{
    font-size:12px; font-weight:700; color:#fff; background:#999;
    border-radius:5px; padding:1px 6px;
  }
  .btns{ display:flex; gap:6px; margin-left:auto; }
  .btns button{
    width:36px; height:36px; border:none; border-radius:9px;
    background:#e8ebf1; color:#333; font-size:16px; font-weight:600;
    cursor:pointer; transition:background .15s, color .15s;
  }
  .desc{
    margin-top:8px;
    font-size:13px; line-height:1.65; color:#555;
    background:#f5f6f9; border-radius:9px; padding:10px 12px;
    min-height:64px;
  }
  .desc b{ color:#222; font-weight:700; margin-right:6px; }
  .foot{
    display:flex; align-items:center; justify-content:space-between;
    border-top:1px solid #eceef2; padding-top:12px; font-size:13px; color:#666;
  }
  .foot label{ display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; color:#333; }
  .foot input[type=checkbox]{ accent-color:#4d6bfe; width:15px; height:15px; }
  #code{ font-weight:700; color:#222; letter-spacing:.5px; }
</style>
</head>
<body>

<h1>IIIA 参与指数贴纸 · HTML 复刻（字体占位，待替换）</h1>

<div class="sticker">
  <div class="header">人工智能参与指数</div>
  <div class="card">
    <div class="chart" id="chart">
      <div class="row top" id="rowTop"></div>
      <div class="row bot" id="rowBot"></div>
      <svg class="star" id="star" viewBox="52.5 175 28 27" xmlns="http://www.w3.org/2000/svg">
        <path id="starPath" fill="#4d6bfe" d="M 69.329 185.007 L 69.329 175.878 L 63.487 175.878 L 63.487 185.007 L 55.235 181.793 L 53.263 187.417 L 61.734 190.265 L 56.330 197.422 L 61.223 201 L 66.335 193.478 L 71.739 201 L 76.559 197.422 L 71.155 190.265 L 79.773 187.417 L 77.801 181.793 Z"/>
      </svg>
    </div>
    <div class="lab left">人工制作</div>
    <div class="lab right">自动生成</div>
  </div>
</div>

<div class="panel">
  <div>
    <div class="row-head">
      <span class="dim">主旨思路<span class="sub">立意 · 观点 · 叙事 · 脚本</span></span>
      <span class="tag" style="background:#b84ccc">Z</span>
      <span class="btns" id="zBtns"></span>
    </div>
    <div class="desc" id="descZ"></div>
  </div>

  <div>
    <div class="row-head">
      <span class="dim">实现过程<span class="sub">素材 · 润色 · 剪辑 · 后期</span></span>
      <span class="tag" style="background:#4d6bfe">S</span>
      <span class="btns" id="sBtns"></span>
    </div>
    <div class="desc" id="descS"></div>
  </div>

  <div class="foot">
    <label><input type="checkbox" id="starToggle" checked> AI主题</label>
    <span>当前标注 <span id="code">IIIA5*</span></span>
  </div>
</div>

<script>
  /* 判定文案取自 README 1.1「维度判定表」 */
  const DESC_Z = [
    "完全由人类完成。立意、观点、叙事与逻辑链均由人工构思，AI 未参与。",
    "完全由人类完成，AI 仅作为工具启发灵感或提供参考（如头脑风暴关键词、热点分析），不直接生成观点。",
    "主要由人类完成，AI 进行基础辅助工作（如语法检查、简单文本润色、事实核对提示）。",
    "AI 完成大量内容模块（如分镜脚本、观点论据、脚本初稿），但经人工深度修改、审核、核实事实并最终定稿，人类保留关键决策权。",
    "AI 主导内容生产的完整逻辑链（如评论的论点推演、故事线设计），人工仅进行有限润色或局部调整（如修改不当表述）。",
    "AI 独立产出完整内容，无人工干预创作过程。"
  ];
  const DESC_S = [
    "完全由人类完成。所有素材均为人工创作或实拍，剪辑、排版、后期完全手动，AI 未参与。",
    "完全由人类完成，AI 仅作为工具提供辅助性灵感（如图片搜索建议、音乐片段推荐）。",
    "主要由人类完成，AI 局部生成少量素材（如背景图、虚拟场景），人工完成素材整合与核心制作。",
    "AI 完成部分关键素材（如主要配图、背景音乐、部分片段），但所有素材均经人工严格筛选、编辑或整合。",
    "AI 主导创作，生成大部分或全部素材，人工仅进行抽查式审核。",
    "AI 全流程自主完成所有素材的生成、选择、编辑与合成。人类无任何创作干预，仅执行操作（如上传、发布）。"
  ];

  const COLORS = ["#fbb47e","#d39390","#b660a8","#b84ccc","#8e61e5","#4d6bfe"];
  const GAP = 11.24, X0 = 25;                          // 卡片内坐标：首列 x=25，列距 73.64
  const W1 = 62.4;                                     // 柱宽恒定，6 根总宽 430.6，左右留白各 25 / 24.4
  let Z = 5, S = 5, aiTheme = true;

  /* 几何（卡片内坐标，卡片 480 × 320）——全部由上下留白 PAD_V 推导，调一处即可整体缩放
     上下留白取 25，与柱组左右留白（左 25 / 右 24.4）一致；内容块恒为 25…295，居中于 160
     柱顶恒为 61（星标 25–52 + 间隙 9），星标区在两种形态下完全静止，切换时只有柱底与轴标签移动
     G1 单数字：激活柱 203.7 + 间隙 7.3 + 轴标签 23
     G2 两位数：上柱 102.5 + 轴带 29 + 下柱 102.5，两组关于轴心 178 镜像 */
  const PAD_V = 25;                                   // 上下留白
  const STAR_H = 27, GAP_A = 9, GAP_B = 7.3, LAB_H = 23, BAND = 29;
  const RATIO  = 71.7 / 128.7;                        // 非激活柱 / 激活柱，沿用原设计比例

  const TOP_Y = PAD_V + STAR_H + GAP_A;               // 柱顶 61
  const END_Y = 320 - PAD_V;                          // 内容块底 295

  const G1_HA = END_Y - TOP_Y - GAP_B - LAB_H;        // 203.7
  const G2_HA = (END_Y - TOP_Y - BAND) / 2;           // 102.5
  const G2_MID = TOP_Y + G2_HA;                       // 上柱底 163.5

  /* 短柱长度：以两位数形态（空间最紧者）定，两种形态统一取同一个值
     一位数形态不再按自身比例放大——长柱 203.7 配短柱 113.5 会显得过于参差 */
  const SHORT_H = +(G2_HA * RATIO).toFixed(1);        // 57.1

  const G1 = { ha:+G1_HA.toFixed(1), hi:SHORT_H, rowBottom:+(320 - (END_Y - GAP_B - LAB_H)).toFixed(1), labTop:END_Y - LAB_H };
  const G2 = { ha:+G2_HA.toFixed(1), hi:SHORT_H, rowBottom:+(320 - G2_MID).toFixed(1),                  labTop:G2_MID + (BAND - LAB_H) / 2 };
  const BOT_BASE = END_Y;                             // 下组基线 295：柱子自最底边长出，再整体上移
  // 长柱一路伸到顶端 G2_MID + BAND(192.5)；短柱只长 hi，故需上移 ha−hi 才能同样齐平于 192.5

  /* 指数缺口：自卡片顶角起算，尺寸按两位数形态（空间最紧者）配平
     短柱顶 = G2_MID − G2.hi = 106.4，这块空间对半分：「缺口边长」=「缺口底边到短柱的距离」= 53.2 */
  const NOTCH_S     = +((G2_MID - G2.hi) / 2).toFixed(1);      // 53.2
  const NOTCH_PAD   = 5;                                       // 缺口内文字四周留白
  const NOTCH_INNER = +(NOTCH_S - NOTCH_PAD * 2).toFixed(1);   // 文字可用区 43.2
  const NOTCH_R     = 14;                                      // 缺口圆角
  const NOTCH_W     = +(NOTCH_S + NOTCH_R).toFixed(1);         // 含向外鼓出部分的包围盒 67.2

  const rowTop   = document.getElementById("rowTop");
  const rowBot   = document.getElementById("rowBot");
  const star     = document.getElementById("star");
  const starPath = document.getElementById("starPath");
  const labs = document.querySelectorAll(".lab");

  /* 数字定位基准 = 短柱高：pad = max(0, h − DIGIT_INSET)
     长柱 pad = h − 57.1（数字落在柱端往上 57.1 的区间内），短柱 pad = 0（整柱居中）
     两种算法得到的数字中心都是距柱端 28.55，六根柱子的数字才会排在同一条线上
     原值 73 是按旧版短柱 71.7 取的，短柱改为 57.1 后必须同步，否则长短柱数字会错开 8px */
  const DIGIT_INSET  = SHORT_H;                        // 57.1

  /* 短柱（非激活）降透明度，退到背景层
     透明度加在 background 上，数字保持白字——底色变浅后白字会自然糊掉，
     这是有意为之：非激活档位本就该弱化，只有激活那根的数字需要清晰可读
     （整柱加 opacity 效果类似，但会把白字一起拖淡，没有额外好处） */
  const DIM_A = 0.55;                                  // 短柱不透明度，取 50–60% 中段
  function rgba(hex, a){
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
  }

  const topPills = [], botPills = [];

  function makeRow(host, store){
    for (let i = 0; i < 6; i++){
      const p = document.createElement("div");
      p.className = "pill";
      p.style.width = W1 + "px";
      p.style.left = (X0 + i * (W1 + GAP)) + "px";
      p.style.background = COLORS[i];
      p.textContent = i;
      host.appendChild(p);
      store.push(p);
    }
  }
  makeRow(rowTop, topPills);
  makeRow(rowBot, botPills);

  /* 缺口形状（局部坐标，原点在卡角）。s = 方形边长，r = 圆角，W = s + r
     路径走向（以左上角缺口为例）：
       卡角(0,0) → 上边到 (W,0) → 鼓出弧到 (s,r) → 右边到 (s,s−r)
       → 内角弧到 (s−r,s) → 下边到 (r,s) → 鼓出弧到 (0,W) → 闭合回卡角
     两条「鼓出弧」的圆心在 (s+r,r) 与 (r,s+r)，圆弧朝卡心方向凸出，把圆角让给白底 */
  function notchPath(mirror){
    const s = NOTCH_S, r = NOTCH_R, W = NOTCH_W;
    const X = v => +(mirror ? W - v : v).toFixed(2);
    const A = (x2, y2, sweep) =>
      "A " + r + " " + r + " 0 0 " + (mirror ? 1 - sweep : sweep) + " " + X(x2) + " " + y2;
    return [
      "M " + X(0) + " 0",
      "L " + X(W) + " 0",
      A(s, r, 0),                       // 与上边相接：蓝向右鼓出
      "L " + X(s) + " " + (s - r),
      A(s - r, s, 1),                   // 内角：蓝被切掉，白鼓进来
      "L " + X(r) + " " + s,
      A(0, s + r, 0),                   // 与左边相接：蓝向下鼓出
      "Z"
    ].join(" ");
  }

  const SVGNS = "http://www.w3.org/2000/svg";
  const notches = ["left", "right"].map((side, i) => {
    const n = document.createElement("div");
    n.className = "notch " + side;
    n.style.width = n.style.height = NOTCH_W + "px";

    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + NOTCH_W + " " + NOTCH_W);
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", notchPath(i === 1));      // 右侧缺口为水平镜像
    svg.appendChild(path);
    n.appendChild(svg);

    const num = document.createElement("div");
    num.className = "num";
    num.style.width = num.style.height = NOTCH_S + "px";
    num.appendChild(document.createElement("span")); // 文字包一层，量宽用
    n.appendChild(num);

    document.querySelector(".card").appendChild(n);
    return { el:n, num };
  });

  /* 缺口文字「尽可能大」：探针字号量一次实际宽度，再按内框宽度反推字号，上限即内框宽 */
  const NOTCH_PROBE = 40;
  function fitNotch(n){
    const box = n.querySelector(".num"), t = box.firstElementChild;
    box.style.fontSize = NOTCH_PROBE + "px";
    const w = t.getBoundingClientRect().width;
    const fs = w > 0 ? Math.min(NOTCH_INNER, NOTCH_PROBE * NOTCH_INNER / w) : NOTCH_PROBE;
    box.style.fontSize = fs.toFixed(1) + "px";
  }

  rowBot.style.top = BOT_BASE + "px";          // 基线固定在最底边，下组从这里长出
  star.style.top   = PAD_V + "px";             // 星标贴住上下留白，两种形态同一位置

  function compose(z, s){                    // 合成规则：差值 ≤1 折叠单数字，≥2 主旨位在前
    return Math.abs(z - s) <= 1 ? "" + Math.max(z, s) : "" + z + s;
  }

  // 立柱：top 行自柱顶向下生长（数字靠柱顶）；bot 行自基线向上长出（数字靠底端，镜像）
  // grow=false 时高度收为 0：配合 overflow:hidden，即「长出去 / 收回来」
  // bot 行的 bottom 是长出后的上移量：长柱为 0（一路伸到位），短柱为 ha−hi（够长后整根上移，顶端齐平）
  function setPills(list, onIndex, g, mirrored, grow){
    list.forEach((p, i) => {
      const h = grow ? (i === onIndex ? g.ha : g.hi) : 0;
      const pad = Math.max(0, h - DIGIT_INSET);
      p.style.background = (grow && i === onIndex) ? COLORS[i] : rgba(COLORS[i], DIM_A);
      p.style.height = h + "px";
      p.style.paddingTop    = mirrored ? pad + "px" : "0px";
      p.style.paddingBottom = mirrored ? "0px" : pad + "px";
      if (mirrored) p.style.bottom = +(grow ? g.ha - h : 0).toFixed(1) + "px";
    });
  }

  function render(){
    const two = Math.abs(Z - S) >= 2;
    const g = two ? G2 : G1;
    const folded = Math.max(Z, S);

    // 柱底、轴标签、柱高共用同一时长与曲线，保证边缘与文字同步位移
    rowTop.style.bottom = g.rowBottom + "px";
    labs.forEach(l => l.style.top = g.labTop + "px");

    setPills(topPills, two ? Z : folded, g, false, true);         // 上组：主旨位（单数字时为折叠值）
    setPills(botPills, S, g, true, two);                          // 下组：实现位，镜像；单数字时收为 0

    const anchor = two ? Z : folded;        // 星标始终在上组伸长的那根柱子上
    star.style.left = +(X0 + anchor * (W1 + GAP) + W1 / 2 - 0.5 - 14).toFixed(2) + "px";
    star.classList.toggle("off", !aiTheme);      // 靠 transform 收放，不用 display（无法过渡）
    starPath.setAttribute("fill", COLORS[anchor]);

    const code = compose(Z, S) + (aiTheme ? "*" : "");
    const side = anchor <= 2 ? 1 : 0;            // 0/1/2 → 右上缺口，3/4/5 → 左上缺口
    notches.forEach((o, i) => {
      o.el.classList.toggle("off", i !== side);
      o.num.firstElementChild.textContent = code;
      fitNotch(o.el);
    });

    document.getElementById("code").textContent = "IIIA" + code;

    document.getElementById("descZ").innerHTML = "<b>Z" + Z + "</b>" + DESC_Z[Z];
    document.getElementById("descS").innerHTML = "<b>S" + S + "</b>" + DESC_S[S];

    document.querySelectorAll("#zBtns button").forEach((b, i) => {
      b.style.background = i === Z ? COLORS[i] : "#e8ebf1";
      b.style.color = i === Z ? "#fff" : "#333";
    });
    document.querySelectorAll("#sBtns button").forEach((b, i) => {
      b.style.background = i === S ? COLORS[i] : "#e8ebf1";
      b.style.color = i === S ? "#fff" : "#333";
    });
  }

  function makeBtns(hostId, onPick){
    const host = document.getElementById(hostId);
    for (let i = 0; i < 6; i++){
      const b = document.createElement("button");
      b.textContent = i;
      b.onclick = () => { onPick(i); render(); };
      host.appendChild(b);
    }
  }
  makeBtns("zBtns", v => Z = v);
  makeBtns("sBtns", v => S = v);

  document.getElementById("starToggle").onchange = e => { aiTheme = e.target.checked; render(); };

  render();
</script>
</body>
</html>
